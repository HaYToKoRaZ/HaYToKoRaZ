name: Katkı Yılanı

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yılanı üret
        uses: Platane/snk@v3
        id: snake-generate
        with:
          github_user_name: HaYToKoRaZ
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23FFB000&color_dots=%231E2A33,%230E7C7B,%232FE0C8,%23FFB000,%23FFD27A

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
