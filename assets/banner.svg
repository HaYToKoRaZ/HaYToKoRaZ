<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Cascadia Code','Consolas','JetBrains Mono',Menlo,monospace">
<defs>
  <style>
    @keyframes reveal { to { opacity: 1; } }
    @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
    @keyframes caret { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
    @keyframes scan { 0% {transform:translateY(-70px);} 100% {transform:translateY(330px);} }
    @keyframes glA { 0%,90.5%,93.5%,100% {opacity:0;} 91%,93% {opacity:.85;} }
    @keyframes glB { 0%,91.5%,94.5%,100% {opacity:0;} 92%,94% {opacity:.85;} }
    .caret { animation: caret 1.05s steps(1) infinite; }
    .scan { animation: scan 9s linear infinite; }
    .glA { animation: glA 7s linear infinite; }
    .glB { animation: glB 7s linear infinite; }
  </style>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2FE0C8" stop-opacity="0"/>
    <stop offset=".5" stop-color="#2FE0C8" stop-opacity=".06"/>
    <stop offset="1" stop-color="#2FE0C8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#101A22" stop-opacity="1"/>
    <stop offset="1" stop-color="#0B1218" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1200" height="320" fill="#0B1218"/>
