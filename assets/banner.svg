<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="HaYTo - modern tech, retro soul">
  <title>HaYTo — modern tech, retro soul</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080C"/>
      <stop offset="55%" stop-color="#0A1017"/>
      <stop offset="100%" stop-color="#0D1A1F"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD27A"/>
      <stop offset="55%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#E08A00"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#2FE0C8"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2FE0C8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- terminal window -->
    <g transform="translate(48, 56)">
      <rect x="0" y="0" width="600" height="208" rx="10" fill="#0B1218" stroke="#1E2A33" stroke-width="1.5"/>
      <rect x="0" y="0" width="600" height="34" rx="10" fill="#111C24"/>
      <rect x="0" y="22" width="600" height="12" fill="#111C24"/>
      <rect x="14" y="12" width="11" height="11" fill="#FF5F57"/>
      <rect x="32" y="12" width="11" height="11" fill="#FFBD2E"/>
      <rect x="50" y="12" width="11" height="11" fill="#28C840"/>
      <text x="82" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6F8896" letter-spacing="1">C:\HAYTO\profile</text>
      <line x1="0" y1="34" x2="600" y2="34" stroke="#1E2A33" stroke-width="1"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
        <text x="22" y="62" fill="#2FE0C8">&gt; whoami</text>
        <text x="22" y="86" fill="#D7E3E8">HaYTo <tspan fill="#6F8896">// browser extensions + native desktop tools</tspan></text>
        <text x="22" y="118" fill="#2FE0C8">&gt; ls products/</text>
        <text x="22" y="142" fill="#D7E3E8">RewriteAI  TabSuspender  XDownloader  WebTranslate</text>
        <text x="22" y="164" fill="#D7E3E8">ExtensityPlus  CloudStartPage  WattCost  FakeLord  +6</text>
        <text x="22" y="196" fill="#2FE0C8">&gt; status <tspan fill="#FFB000">shipping</tspan><tspan fill="#6F8896"> · 13 products · zero telemetry</tspan></text>
        <rect x="278" y="185" width="9" height="14" fill="#FFB000">
          <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- wordmark -->
    <g transform="translate(700, 56)">
      <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="86" font-weight="700" fill="url(#amber)" filter="url(#soft)" letter-spacing="-2">HaYTo</text>
      <text x="4" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7FA6A3" letter-spacing="4">MODERN TECH · RETRO SOUL</text>
      <line x1="4" y1="136" x2="440" y2="136" stroke="url(#teal)" stroke-width="2"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9FB4BC">
        <rect x="4" y="154" width="76" height="24" rx="4" fill="#101E22" stroke="#1B3438"/>
        <text x="16" y="170">PYTHON</text>
        <rect x="88" y="154" width="72" height="24" rx="4" fill="#101E22" stroke="#1B3438"/>
        <text x="100" y="170">C# / .NET</text>
        <rect x="168" y="154" width="84" height="24" rx="4" fill="#101E22" stroke="#1B3438"/>
        <text x="180" y="170">JAVASCRIPT</text>
        <rect x="260" y="154" width="66" height="24" rx="4" fill="#101E22" stroke="#1B3438"/>
        <text x="272" y="170">WIN32</text>
      </g>
      <text x="4" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5C7581">github.com/HaYToKoRaZ</text>
    </g>
  </g>

  <rect width="1200" height="320" fill="url(#scan)" pointer-events="none"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="14" fill="none" stroke="#22323B" stroke-width="1.5"/>
</svg>
