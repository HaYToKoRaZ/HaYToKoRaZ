1C25" stroke-width="1"/><line x1="0" y1="48" x2="1200" y2="48" stroke="#111C25" stroke-width="1"/><line x1="0" y1="96" x2="1200" y2="96" stroke="#111C25" stroke-width="1"/><line x1="0" y1="144" x2="1200" y2="144" stroke="#111C25" stroke-width="1"/><line x1="0" y1="192" x2="1200" y2="192" stroke="#111C25" stroke-width="1"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#111C25" stroke-width="1"/><line x1="0" y1="288" x2="1200" y2="288" stroke="#111C25" stroke-width="1"/>
